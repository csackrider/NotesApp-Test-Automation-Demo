name: AIDLC PR notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Assign and notify on AIDLC PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullRequest = context.payload.pull_request;
            const issueNumber = pullRequest.number;
            const assignee = 'csackrider';
            const action = context.payload.action;

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: issueNumber,
              assignees: [assignee],
            }).catch((error) => {
              if (error.status !== 422) {
                throw error;
              }
            });

            let body;
            if (action === 'ready_for_review') {
              body =
                `@${assignee} this AIDLC/Cursor PR is ready for review.\n\n` +
                `- PR: #${issueNumber}\n` +
                `- Branch: \`${pullRequest.head.ref}\``;
            } else if (pullRequest.draft) {
              body =
                `@${assignee} a draft AIDLC/Cursor PR has been created and assigned to you.\n\n` +
                `I'll ping again when it is marked ready for review.\n\n` +
                `- PR: #${issueNumber}\n` +
                `- Branch: \`${pullRequest.head.ref}\``;
            } else {
              body =
                `@${assignee} this AIDLC/Cursor PR is open and ready for review.\n\n` +
                `- PR: #${issueNumber}\n` +
                `- Branch: \`${pullRequest.head.ref}\``;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
