# AIDLC: launch a Cursor Cloud Agent when aidlc_work:unstarted is applied.
# This workflow is intentionally thin; launch logic lives in the shared AI-DLC action.

name: AIDLC Agent Launch

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: string
      phase:
        description: AIDLC phase
        required: true
        type: choice
        options: [plan, design, build, review, ship]

permissions:
  contents: read
  issues: write

jobs:
  launch-agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'aidlc_work:unstarted'
    runs-on: ubuntu-latest
    steps:
      - name: Launch AIDLC Cursor agent
        uses: csackrider/AI-DLC/.github/actions/aidlc-launch@f78276f
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}
          aidlc-project-pat: ${{ secrets.AIDLC_PROJECT_PAT }}
          project-owner: ${{ vars.AIDLC_PROJECT_OWNER }}
          project-number: ${{ vars.AIDLC_PROJECT_NUMBER }}
          default-branch: main
