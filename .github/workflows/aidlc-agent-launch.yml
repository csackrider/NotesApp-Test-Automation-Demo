# .github/workflows/aidlc-agent-launch.yml
# Triggers when aidlc_work:unstarted label is applied to an issue.
# Reads the project board phase, launches a Cursor Cloud Agent for that phase.

name: AIDLC Agent Launch

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
      phase:
        description: 'Phase to run (plan/design/build/review)'
        required: true

jobs:
  launch-agent:
    if: github.event.label.name == 'aidlc_work:unstarted' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Determine phase from project board
        id: get-phase
        env:
          GH_TOKEN: ${{ secrets.AIDLC_PROJECT_PAT }}
        run: |
          # For manual dispatch, use the provided phase
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "phase=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
            echo "issue=${{ github.event.inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "issue=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            # Query the project board to find which column this issue is in
            # This requires AIDLC_PROJECT_PAT with project scope
            ISSUE_NUM="${{ github.event.issue.number }}"
            OWNER="${{ github.repository_owner }}"
            REPO="${{ github.event.repository.name }}"
            
            # Get project status field for this issue via GraphQL
            PHASE=$(gh api graphql -H "Authorization: token $GH_TOKEN" -f query='
              query($owner: String!, $repo: String!, $issue: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue) {
                    projectItems(first: 5) {
                      nodes {
                        fieldValues(first: 10) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field { ... on ProjectV2SingleSelectField { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' -f owner="$OWNER" -f repo="$REPO" -F issue="$ISSUE_NUM" \
              --jq '.data.repository.issue.projectItems.nodes[0].fieldValues.nodes[] | select(.field.name == "Status") | .name' \
              2>/dev/null | tr '[:upper:]' '[:lower:]' || echo "plan")
            
            echo "phase=${PHASE:-plan}" >> $GITHUB_OUTPUT
          fi

      - name: Post "launching" comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.get-phase.outputs.issue }} \
            --body "🤖 **AIDLC Agent launching** for phase: \`${{ steps.get-phase.outputs.phase }}\`  
          The agent will post a summary when complete." \
            --repo ${{ github.repository }}

      - name: Swap labels (unstarted → in_progress)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ steps.get-phase.outputs.issue }} \
            --remove-label "aidlc_work:unstarted" \
            --add-label "aidlc_work:in_progress" \
            --repo ${{ github.repository }}

      - name: Launch Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          PHASE="${{ steps.get-phase.outputs.phase }}"
          ISSUE="${{ steps.get-phase.outputs.issue }}"
          REPO="${{ github.repository }}"
          REPO_URL="https://github.com/${REPO}"
          
          # Build the prompt for this phase
          PROMPT="You are running the AIDLC /${PHASE} skill for GitHub issue #${ISSUE} in ${REPO}.

          1. Read .claude/skills/${PHASE}/SKILL.md for instructions.
          2. Read the issue body: run \`gh issue view ${ISSUE}\` to get full details.
          3. Execute the skill exactly as specified — do NOT proceed to the next phase.
          4. When complete, post a summary comment on the issue using \`gh issue comment ${ISSUE} --body '...'\`
          5. Clear the in_progress label: \`gh issue edit ${ISSUE} --remove-label aidlc_work:in_progress\`
          
          HARD STOP: Only execute the ${PHASE} phase. Do not plan AND build in one run."
          
          # Call Cursor Cloud Agent API
          curl -sS -X POST "https://api.cursor.com/v1/agents" \
            -u "$CURSOR_API_KEY:" \
            -H "Content-Type: application/json" \
            -d "{
              \"prompt\": {
                \"text\": $(echo "$PROMPT" | jq -Rs .)
              },
              \"repos\": [
                {
                  \"url\": \"${REPO_URL}\"
                }
              ]
            }"
